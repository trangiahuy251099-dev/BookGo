{% extends "base.html" %}
{% block title %}Thêm sách mới{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0 rounded-4">
            <div class="card-header bg-success text-white rounded-top-4">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Thêm sách mới</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Tên sách</label>
                            <input type="text" name="title" class="form-control rounded-pill" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tác giả</label>
                            <input type="text" name="author" class="form-control rounded-pill" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Giá bán (VNĐ)</label>
                            <input type="number" name="price" class="form-control rounded-pill" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Giá gốc (VNĐ)</label>
                            <input type="number" name="original_price" class="form-control rounded-pill" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Ảnh bìa (file)</label>
                            <input type="file" name="cover_file" class="form-control" accept="image/*">
                            <div class="text-muted small mt-1">Hoặc nhập URL ảnh bên dưới</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">URL ảnh (nếu có)</label>
                            <input type="url" name="cover_url" class="form-control rounded-pill" placeholder="https://...">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Mô tả</label>
                            <textarea name="description" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số trang</label>
                            <input type="number" name="pages" class="form-control rounded-pill">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nhà xuất bản</label>
                            <input type="text" name="publisher" class="form-control rounded-pill">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Danh mục</label>
                            <select name="category_id" class="form-select rounded-pill">
                                <option value="">-- Chọn danh mục --</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-between">
                        <button type="submit" class="btn btn-success rounded-pill px-4"><i class="bi bi-save"></i> Lưu sách</button>
                        <a href="{{ url_for('admin_books') }}" class="btn btn-secondary rounded-pill px-4">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
