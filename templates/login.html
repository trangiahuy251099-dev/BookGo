{% extends "base.html" %}
{% block title %}Đăng nhập - BookGo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0 rounded-4">
            <div class="card-header bg-primary text-white text-center rounded-top-4">
                <h4 class="mb-0"><i class="bi bi-key"></i> Đăng nhập</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Tên đăng nhập</label>
                        <input type="text" name="username" class="form-control rounded-pill" placeholder="Nhập username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" name="password" class="form-control rounded-pill" placeholder="••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">Đăng nhập</button>
                </form>
                <p class="mt-3 text-center">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký ngay</a></p>
                <hr>
                <p class="small text-muted text-center mb-0">Demo: admin / admin123 | user1 / 123456</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
